name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version:" && yarn -v

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Lint & format check (oxlint + oxfmt)
        run: yarn test:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version:" && yarn -v

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test (Vitest)
        run: yarn test:ci

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: ./reports/vitest/test-results.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version:" && yarn -v

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/rc'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version:" && yarn -v

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Run semantic-release
        run: yarn release

# Deployment: Render auto-deploys the production service from `main` (Dockerfile build), so CI does not deploy.
